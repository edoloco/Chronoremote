name: Compilar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Número de versión (fecha y hora de Chile)
        run: |
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> $GITHUB_ENV
          echo "VERSION_NAME=1.$(TZ=America/Santiago date +%y%m%d.%H%M)" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/completa/release/*.apk ChronoRemote.apk
          cp app/build/outputs/apk/liviana/release/*.apk ChronoRemote-liviana.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Chrono Remote ${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            ChronoRemote-liviana.apk
            ChronoRemote.apk
          body: |
            Versión ${{ env.VERSION_NAME }}. ${{ github.event.head_commit.message }}
            ChronoRemote-liviana.apk: sin permisos sensibles; Play Protect no la bloquea. Sirve para la TV y los teléfonos.
            ChronoRemote.apk: completa (Atrás, flechas y escribir en cualquier app de la TV, usa accesibilidad). Puede que Play Protect la bloquee.
