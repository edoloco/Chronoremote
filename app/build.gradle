plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.chronoremote'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.chronoremote'
        minSdk 28
        targetSdk 34
        // número de versión basado en fecha y hora: siempre crece, aunque cambie el archivo de compilación
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName(System.getenv('VERSION_NAME') ?: '1.0')
        // repositorio de GitHub (dueño/nombre) para que la app busque sus propias actualizaciones
        resValue "string", "repo", (System.getenv('GITHUB_REPOSITORY') ?: '')
    }

    buildFeatures { resValues true }

    // "completa": con accesibilidad (Atrás, flechas, escribir) · "liviana": sin permisos sensibles, Play Protect no la bloquea
    flavorDimensions "version"
    productFlavors {
        completa { dimension "version" }
        liviana { dimension "version"; versionNameSuffix "-liviana" }
    }


    signingConfigs {
        // Llave fija para que cada nueva versión se instale encima de la anterior
        fija {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
